<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NezWorks — Relax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/relax.css">
</head>
<body>

<div class="scroll-progress" aria-hidden="true"><span></span></div>

<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor-dot"></div>
  <div class="cursor-label"></div>
</div>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <img class="logo-mark" src="assets/nezworks-logo.svg" alt="NezWorks logo">
      <span class="logo-word">NEZWORKS</span>
    </a>
    <nav class="nav-links">
      <a href="services.html" data-cursor="link">Services</a>
      <a href="how.html" data-cursor="link">How we work</a>
      <a href="relax.html" data-cursor="link">Relax</a>
    </nav>
    <div class="nav-cta">
      <a href="project.html" class="btn btn-primary btn-sm" data-cursor="hover">Start a Project <span class="btn-arrow">→</span></a>
    </div>
  </div>
</header>


<main class="relax-main" id="top">

  <!-- SCENE STAGE -->
  <section class="relax-stage" id="relaxStage">
    <div class="relax-bg" id="relaxBg" aria-hidden="true"></div>
    <div class="relax-window" id="relaxWindow" aria-hidden="true"></div>
    <canvas class="relax-fx" id="relaxFx" aria-hidden="true"></canvas>
    <div class="relax-dim" id="relaxDim" aria-hidden="true"></div>
  </section>

</main>

<!-- RELAX CONTROL DRAWER (เปิดจากปุ่ม Relax ใน Header) -->
<aside class="relax-drawer" id="relaxDrawer" aria-hidden="true">
  <div class="rd-head">
    <div>
      <p class="rd-kicker">RELAX CONTROL</p>
    </div>
    <button class="rd-close" id="rdClose" data-cursor="hover" aria-label="ปิดแผง">✕</button>
  </div>

  <!-- Season -->
  <section class="rd-section">
    <h3 class="rd-title">Season</h3>
    <p class="rd-sub">Pick a seasonal atmosphere</p>
    <div class="season-grid" id="seasonGrid">
      <button class="season-btn" data-season="summer" data-cursor="hover" aria-pressed="false">
        <img src="assets/seasons/summer.jpg" alt=""><span>Summer</span>
      </button>
      <button class="season-btn" data-season="winter" data-cursor="hover" aria-pressed="false">
        <img src="assets/seasons/winter.jpg" alt=""><span>Winter</span>
      </button>
      <button class="season-btn" data-season="autumn" data-cursor="hover" aria-pressed="false">
        <img src="assets/seasons/autumn.jpg" alt=""><span>Autumn</span>
      </button>
      <button class="season-btn" data-season="spring" data-cursor="hover" aria-pressed="false">
        <img src="assets/seasons/spring.jpg" alt=""><span>Spring</span>
      </button>
      <button class="season-btn" data-season="rainy" data-cursor="hover" aria-pressed="false">
        <img src="assets/seasons/rainy.jpg" alt=""><span>Rainy</span>
      </button>
    </div>
  </section>

  <!-- Brightness -->
  <section class="rd-section">
    <h3 class="rd-title">Brightness</h3>
    <p class="rd-sub">Drag to increase or reduce brightness</p>
    <div class="rd-slider-row">
      <span class="rd-sl-icon">🌑</span>
      <input type="range" min="0" max="100" value="35" id="brightness" aria-label="Adjust brightness">
      <span class="rd-sl-icon">☀️</span>
    </div>
    <p class="rd-value" id="brightnessVal">Brightness 35%</p>
  </section>

  <!-- Sound -->
  <section class="rd-section">
    <h3 class="rd-title">Sound</h3>
    <p class="rd-sub">Choose your sound mood</p>
    <div class="sound-grid" id="soundGrid">
      <button class="mood-btn" data-mood="rnb" data-cursor="hover" aria-pressed="false">R&amp;B</button>
      <button class="mood-btn" data-mood="jazz" data-cursor="hover" aria-pressed="false">Jazz</button>
      <button class="mood-btn" data-mood="cozy" data-cursor="hover" aria-pressed="false">Cozy</button>
      <button class="mood-btn" data-mood="warm" data-cursor="hover" aria-pressed="false">Warm</button>
      <button class="mood-btn" data-mood="fun" data-cursor="hover" aria-pressed="false">Fun</button>
      <button class="mood-btn" data-mood="space" data-cursor="hover" aria-pressed="false">Space</button>
      <button class="mood-btn" data-mood="dream" data-cursor="hover" aria-pressed="false">Dream</button>
      <button class="mood-btn" data-mood="focus" data-cursor="hover" aria-pressed="false">Focus</button>
    </div>
  </section>

  <p class="rd-foot">Good work doesn't have to be rushed — rest before you create again<br><a href="index.html">← Back home</a></p>
</aside>

<script src="js/utils.js"></script>
<script src="js/nav-dropdown.js"></script>
<script src="js/cursor.js"></script>
<script src="js/relax.js"></script>
</body>
</html>
