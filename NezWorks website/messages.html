<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NezWorks — Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/radio.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
.msg-wrap{display:flex;height:100vh;padding-top:var(--nav-h)}
.msg-sidebar{width:280px;border-right:1px solid var(--stroke);background:rgba(255,255,255,.02);display:flex;flex-direction:column;flex:none}
.msg-sidebar-header{padding:20px;border-bottom:1px solid var(--stroke)}
.msg-sidebar-header h2{font-family:var(--font-display);font-size:1.1rem;font-weight:600}
.msg-list{flex:1;overflow-y:auto;padding:8px}
.msg-contact{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;transition:background .15s}
.msg-contact:hover{background:rgba(255,255,255,.05)}
.msg-contact.active{background:rgba(139,124,246,.12);border:1px solid rgba(139,124,246,.25)}
.msg-contact-avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.9rem;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none}
.msg-contact-info{flex:1;min-width:0}
.msg-contact-name{font-size:.85rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-contact-preview{font-size:.72rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.msg-contact-time{font-size:.6rem;color:var(--ink-3);flex:none}
.msg-chat{flex:1;display:flex;flex-direction:column;background:rgba(255,255,255,.01)}
.msg-chat-header{padding:16px 24px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;gap:12px}
.msg-chat-avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.8rem;background:linear-gradient(135deg,var(--accent),var(--accent-2));flex:none}
.msg-chat-name{font-weight:600;font-size:.9rem}
.msg-chat-role{font-size:.65rem;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.msg-messages{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px}
.msg-bubble{max-width:70%;padding:12px 16px;border-radius:16px;font-size:.85rem;line-height:1.5;animation:fadeUp .25s ease}
.msg-bubble.sent{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;border-bottom-right-radius:4px}
.msg-bubble.received{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--stroke-soft);border-bottom-left-radius:4px}
.msg-bubble-time{font-size:.55rem;opacity:.6;margin-top:4px;text-align:right}
.msg-invoice-bubble{max-width:80%;padding:16px;border-radius:16px;background:rgba(255,200,50,.08);border:1px solid rgba(255,200,50,.25);animation:fadeUp .25s ease}
.msg-invoice-bubble.sent{align-self:flex-end;border-bottom-right-radius:4px}
.msg-invoice-bubble.received{align-self:flex-start;border-bottom-left-radius:4px}
.msg-invoice-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.msg-invoice-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(255,200,50,.15);color:#ffc832}
.msg-invoice-title{font-weight:600;font-size:.82rem}
.msg-invoice-items{font-size:.78rem;color:var(--ink-2);margin-bottom:8px}
.msg-invoice-total{font-weight:700;font-size:.95rem;color:var(--ink);border-top:1px solid var(--stroke-soft);padding-top:8px}
.msg-invoice-status{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.65rem;font-weight:600;margin-top:8px}
.msg-invoice-status.pending{background:rgba(255,200,50,.15);color:#ffc832}
.msg-invoice-status.paid{background:rgba(52,211,153,.15);color:#34d399}
.msg-input-wrap{padding:16px 24px;border-top:1px solid var(--stroke);display:flex;align-items:center;gap:12px}
.msg-plus-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--stroke);background:rgba(255,255,255,.04);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s;flex:none;color:var(--ink-3)}
.msg-plus-btn:hover{background:rgba(139,124,246,.12);border-color:var(--accent-2);color:var(--accent-2)}
.msg-input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:24px;padding:12px 18px;font:inherit;font-size:.85rem;color:var(--ink);outline:none;transition:border-color .2s}
.msg-input:focus{border-color:var(--accent-2)}
.msg-send-btn{width:40px;height:40px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;cursor:pointer;transition:opacity .15s;flex:none}
.msg-send-btn:disabled{opacity:.3}
.msg-send-btn svg{color:#fff}
.msg-empty{flex:1;display:grid;place-items:center;color:var(--ink-3);font-size:.9rem}

/* Invoice modal */
.invoice-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:100;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.invoice-overlay.open{opacity:1;visibility:visible}
.invoice-modal{width:min(440px,90vw);max-height:85vh;overflow-y:auto;padding:32px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateY(20px);transition:transform .25s}
.invoice-overlay.open .invoice-modal{transform:translateY(0)}
.invoice-modal h2{font-family:var(--font-display);font-size:1.1rem;font-weight:600;margin-bottom:20px}
.invoice-row{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.invoice-row input{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:10px;padding:10px 14px;font:inherit;font-size:.82rem;color:var(--ink);outline:none}
.invoice-row input:focus{border-color:var(--accent-2)}
.invoice-row .invoice-qty{width:60px;flex:none}
.invoice-row .invoice-price{width:100px;flex:none}
.invoice-add-row{font-size:.78rem;color:var(--accent-2);cursor:pointer;margin-bottom:16px;display:inline-block}
.invoice-total-row{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;padding-top:12px;border-top:1px solid var(--stroke-soft);margin-top:12px}
.invoice-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
@media(max-width:768px){.msg-sidebar{display:none}.msg-wrap{flex-direction:column}}
</style>
</head>
<body>

<div class="scroll-progress" aria-hidden="true"><span></span></div>
<div class="nebula" aria-hidden="true">
  <div class="nebula-light nebula-purple"></div>
  <div class="nebula-light nebula-blue"></div>
  <div class="nebula-light nebula-peach"></div>
</div>
<canvas id="cosmos" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor-dot"></div>
  <div class="cursor-label"></div>
</div>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <img class="logo-mark" src="assets/nezworks-logo.svg" alt="NezWorks logo">
      <span class="logo-word">NEZWORKS</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-cursor="link" data-i18n="nav-home">Home</a>
      <a href="services.html" data-cursor="link" data-i18n="nav-services">Services</a>
      <a href="how.html" data-cursor="link" data-i18n="nav-how">How we work</a>
      <a href="relax.html" data-cursor="link" data-i18n="nav-relax">Relax</a>
      <a href="contact.html" data-cursor="link" data-i18n="nav-contact">Contact</a>
      <a href="faq.html" data-cursor="link" data-i18n="nav-faq">FAQ</a>
    </nav>
    <div class="nav-cta"></div>
  </div>
</header>

<main class="msg-wrap" id="top">
  <aside class="msg-sidebar" id="msgSidebar">
    <div class="msg-sidebar-header"><h2 data-i18n="msg-title">Messages</h2></div>
    <div class="msg-list" id="msgList"></div>
  </aside>
  <section class="msg-chat" id="msgChat">
    <div class="msg-empty" id="msgEmpty" data-i18n="msg-empty">Select a conversation to start chatting</div>
    <div class="msg-chat-header" id="msgChatHeader" style="display:none">
      <div class="msg-chat-avatar" id="chatAvatar"></div>
      <div>
        <div class="msg-chat-name" id="chatName"></div>
        <div class="msg-chat-role" id="chatRole"></div>
      </div>
    </div>
    <div class="msg-messages" id="msgMessages" style="display:none"></div>
    <div class="msg-input-wrap" id="msgInputWrap" style="display:none">
      <button class="msg-plus-btn" id="plusBtn" data-cursor="hover" data-i18n-title="msg-create-inv" title="Create Invoice">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <input type="text" class="msg-input" id="msgInput" data-i18n-placeholder="msg-input" placeholder="Type a message..." autocomplete="off">
      <button class="msg-send-btn" id="sendBtn" disabled data-cursor="hover">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </section>
</main>

<!-- Invoice Modal -->
<div class="invoice-overlay" id="invoiceOverlay">
  <div class="invoice-modal">
    <h2 data-i18n="msg-create-inv">Create Invoice</h2>
    <div id="invoiceRows"></div>
    <span class="invoice-add-row" id="addRowBtn">+ Add item</span>
    <div class="invoice-total-row"><span>Total</span><span id="invoiceTotal">฿0</span></div>
    <div class="invoice-actions">
      <button class="btn btn-ghost btn-sm" id="cancelInvoice">Cancel</button>
      <button class="btn btn-primary btn-sm" id="sendInvoice">Send Invoice <span class="btn-arrow">→</span></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/user-backup.js"></script>
<script src="js/cosmos.js"></script>
<script src="js/nav-dropdown.js"></script>
<script src="js/cursor.js"></script>
<script src="js/user-chip.js"></script>
<script src="js/messages.js"></script>
<script src="js/scroll.js"></script>
<script src="js/i18n.js"></script>
<script src="js/radio.js"></script>
</body>
</html>
