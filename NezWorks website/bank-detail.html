<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NezWorks — Bank Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/radio.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
.bank-wrap{display:flex;flex-direction:column;align-items:center;padding:calc(var(--nav-h) + 60px) 20px 80px;min-height:100vh}
.bank-card{width:min(480px,100%);padding:36px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bank-header{text-align:center;margin-bottom:32px}
.bank-header h1{font-family:var(--font-display);font-size:1.4rem;font-weight:600;margin-bottom:8px}
.bank-header p{font-size:.82rem;color:var(--ink-2)}
.bank-section{margin-bottom:24px}
.bank-section h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.bank-field{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--stroke-soft);margin-bottom:6px}
.bank-field .bf-label{font-size:.82rem;color:var(--ink-2)}
.bank-field .bf-value{font-size:.82rem;font-weight:600;color:var(--ink);text-align:right;max-width:260px;word-break:break-all}
.bank-field .bf-input{background:transparent;border:0;outline:none;font-family:inherit;font-size:.82rem;font-weight:600;color:var(--ink);text-align:right;max-width:220px;padding:0;appearance:none;-webkit-appearance:none}
.bank-field select.bf-input{padding-right:0;cursor:pointer}
.bank-field .bf-input::placeholder{color:var(--ink-3);font-weight:400}
.bank-field .bf-input:focus{color:var(--ink)}
.bank-empty{text-align:center;color:var(--ink-3);font-size:.88rem;padding:60px 20px}
.bank-empty p{margin-top:12px}
.bank-empty a{color:var(--accent-2);text-decoration:underline}
</style>
</head>
<body>

<div class="scroll-progress" aria-hidden="true"><span></span></div>
<div class="nebula" aria-hidden="true">
  <div class="nebula-light nebula-purple"></div>
  <div class="nebula-light nebula-blue"></div>
  <div class="nebula-light nebula-peach"></div>
</div>
<canvas id="cosmos" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor-dot"></div>
  <div class="cursor-label"></div>
</div>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <img class="logo-mark" src="assets/nezworks-logo.svg" alt="NezWorks logo">
      <span class="logo-word">NEZWORKS</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-cursor="link" data-i18n="nav-home">Home</a>
      <a href="services.html" data-cursor="link" data-i18n="nav-services">Services</a>
      <a href="how.html" data-cursor="link" data-i18n="nav-how">How we work</a>
      <a href="relax.html" data-cursor="link" data-i18n="nav-relax">Relax</a>
      <a href="contact.html" data-cursor="link" data-i18n="nav-contact">Contact</a>
      <a href="faq.html" data-cursor="link" data-i18n="nav-faq">FAQ</a>
    </nav>
    <div class="nav-cta"></div>
  </div>
</header>

<main class="bank-wrap" id="top">
  <div class="bank-card" id="bankCard"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/user-backup.js"></script>
<script src="js/cosmos.js"></script>
<script src="js/nav-dropdown.js"></script>
<script src="js/cursor.js"></script>
<script src="js/user-chip.js"></script>
<script src="js/bank-detail.js"></script>
<script src="js/scroll.js"></script>
<script src="js/i18n.js"></script>
<script src="js/radio.js"></script>
</body>
</html>
