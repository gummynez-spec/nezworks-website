<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NezWorks — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/radio.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{width:min(420px,100%);padding:40px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.login-header{text-align:center;margin-bottom:32px}
.login-header img{width:48px;height:48px;margin-bottom:16px}
.login-header h1{font-family:var(--font-display);font-size:1.4rem;font-weight:600;margin-bottom:8px}
.login-header p{font-size:.82rem;color:var(--ink-2)}
.login-field{margin-bottom:20px}
.login-field label{display:block;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.login-field input{width:100%;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);font:inherit;font-size:.9rem;color:var(--ink);outline:none;transition:border-color .2s}
.login-field input:focus{border-color:var(--accent-2)}
.login-field input::placeholder{color:var(--ink-3)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:48px}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:0;border:0;color:var(--ink-3);cursor:pointer;padding:4px;display:grid;place-items:center;transition:color .15s}
.pw-toggle:hover{color:var(--accent-2)}
.login-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent-2));font:inherit;font-size:.9rem;font-weight:600;color:#fff;cursor:pointer;transition:opacity .15s;margin-top:8px}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.4;cursor:not-allowed}
.login-error{color:#ef4444;font-size:.78rem;text-align:center;margin-top:12px;min-height:20px}
.login-footer{text-align:center;margin-top:24px;font-size:.8rem;color:var(--ink-3)}
.login-footer a{color:var(--accent-2);text-decoration:underline}
.login-divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--ink-3);font-size:.72rem}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--stroke)}
</style>
</head>
<body>

<div class="scroll-progress" aria-hidden="true"><span></span></div>
<div class="nebula" aria-hidden="true">
  <div class="nebula-light nebula-purple"></div>
  <div class="nebula-light nebula-blue"></div>
  <div class="nebula-light nebula-peach"></div>
</div>
<canvas id="cosmos" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor-dot"></div>
  <div class="cursor-label"></div>
</div>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <img class="logo-mark" src="assets/nezworks-logo.svg" alt="NezWorks logo">
      <span class="logo-word">NEZWORKS</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-cursor="link" data-i18n="nav-home">Home</a>
      <a href="services.html" data-cursor="link" data-i18n="nav-services">Services</a>
      <a href="how.html" data-cursor="link" data-i18n="nav-how">How we work</a>
      <a href="relax.html" data-cursor="link" data-i18n="nav-relax">Relax</a>
      <a href="contact.html" data-cursor="link" data-i18n="nav-contact">Contact</a>
      <a href="faq.html" data-cursor="link" data-i18n="nav-faq">FAQ</a>
    </nav>
    <div class="nav-cta"></div>
  </div>
</header>

<main class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <img src="assets/nezworks-logo.svg" alt="NezWorks">
      <h1 data-i18n="login-title">Welcome back</h1>
      <p data-i18n="login-subtitle">Log in to your NezWorks account</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="login-field">
        <label data-i18n="login-email">Email</label>
        <input type="email" name="email" required placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="login-field">
        <label data-i18n="login-password">Password</label>
        <div class="pw-wrap">
          <input type="password" name="password" required placeholder="Your password" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-cursor="hover" aria-label="Show password">
            <svg class="pw-eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="pw-eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn" data-cursor="hover" data-i18n="login-btn">Log in</button>
      <div class="login-error" id="loginError"></div>
    </form>

    <div class="login-footer">
      <span data-i18n="login-footer">Don't have an account?</span> <a href="register-client.html" data-i18n="login-reg-client">Register as Client</a> <span data-i18n="login-or">or</span> <a href="register-freelancer.html" data-i18n="login-reg-free">Freelancer</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/cosmos.js"></script>
<script src="js/nav-dropdown.js"></script>
<script src="js/cursor.js"></script>
<script src="js/login.js"></script>
<script src="js/scroll.js"></script>
<script src="js/i18n.js"></script>
<script src="js/radio.js"></script>
</body>
</html>
