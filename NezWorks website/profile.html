<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NezWorks — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/radio.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
.profile-wrap{display:flex;flex-direction:column;align-items:center;padding:calc(var(--nav-h) + 60px) 20px 80px;min-height:100vh}
.profile-card{width:min(480px,100%);padding:36px;border-radius:20px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.profile-header{display:flex;align-items:center;gap:18px;margin-bottom:28px}
.profile-avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.5rem;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 0 24px rgba(139,124,246,.4);flex:none}
.profile-header-text h1{font-family:var(--font-display);font-size:1.4rem;font-weight:600;margin-bottom:4px}
.profile-role{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-2)}
.profile-section{margin-bottom:22px}
.profile-section h3{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.profile-field{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--stroke-soft);margin-bottom:6px}
.profile-field .pf-label{font-size:.82rem;color:var(--ink-2)}
.profile-field .pf-value{font-size:.82rem;font-weight:600;color:var(--ink)}
.profile-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.profile-tag{padding:6px 14px;border-radius:20px;font-size:.76rem;font-weight:600;background:rgba(139,124,246,.12);border:1px solid rgba(139,124,246,.3);color:var(--accent-2)}
.profile-empty{text-align:center;color:var(--ink-3);font-size:.88rem;padding:60px 20px}
.profile-empty p{margin-top:12px}
</style>
</head>
<body>

<div class="scroll-progress" aria-hidden="true"><span></span></div>
<div class="nebula" aria-hidden="true">
  <div class="nebula-light nebula-purple"></div>
  <div class="nebula-light nebula-blue"></div>
  <div class="nebula-light nebula-peach"></div>
</div>
<canvas id="cosmos" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor-dot"></div>
  <div class="cursor-label"></div>
</div>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <img class="logo-mark" src="assets/nezworks-logo.svg" alt="NezWorks logo">
      <span class="logo-word">NEZWORKS</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-cursor="link">Home</a>
      <a href="services.html" data-cursor="link">Services</a>
      <a href="how.html" data-cursor="link">How we work</a>
      <a href="relax.html" data-cursor="link">Relax</a>
      <a href="contact.html" data-cursor="link">Contact</a>
      <a href="faq.html" data-cursor="link">FAQ</a>
    </nav>
    <div class="nav-cta"></div>
  </div>
</header>

<main class="profile-wrap" id="top">
  <div class="profile-card" id="profileCard"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/cosmos.js"></script>
<script src="js/nav-dropdown.js"></script>
<script src="js/cursor.js"></script>
<script src="js/user-chip.js"></script>
<script src="js/profile.js"></script>
<script src="js/scroll.js"></script>
<script src="js/radio.js"></script>
</body>
</html>
