<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NezWorks — Work Detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/radio.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="scroll-progress" aria-hidden="true"><span></span></div>
<div class="nebula" aria-hidden="true">
  <div class="nebula-light nebula-purple"></div>
  <div class="nebula-light nebula-blue"></div>
  <div class="nebula-light nebula-peach"></div>
</div>
<canvas id="cosmos" aria-hidden="true"></canvas>
<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor-dot"></div>
  <div class="cursor-label"></div>
</div>

<header class="nav" id="nav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html">
      <img class="logo-mark" src="assets/nezworks-logo.svg" alt="NezWorks logo">
      <span class="logo-word">NEZWORKS</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" data-cursor="link" data-i18n="nav-home">Home</a>
      <a href="services.html" data-cursor="link" data-i18n="nav-services">Services</a>
      <a href="how.html" data-cursor="link" data-i18n="nav-how">Process</a>
      <a href="relax.html" data-cursor="link" data-i18n="nav-relax">Relax</a>
      <a href="contact.html" data-cursor="link" data-i18n="nav-contact">Contact</a>
      <a href="faq.html" data-cursor="link" data-i18n="nav-faq">FAQ</a>
    </nav>
    <div class="nav-cta"></div>
  </div>
</header>

<main class="wd-wrap" id="top">
  <div class="wd-container">

    <!-- Loading / Not found -->
    <div class="wd-loading" id="wdLoading" style="text-align:center;padding:120px 0">
      <p style="color:var(--ink-3)">Loading work details...</p>
    </div>
    <div class="wd-notfound" id="wdNotFound" style="display:none;text-align:center;padding:120px 0">
      <h2 style="margin-bottom:12px">Work not found</h2>
      <p style="color:var(--ink-3);margin-bottom:24px">This listing may have been removed or the link is invalid.</p>
      <a href="index.html" class="btn btn-ghost" data-cursor="hover">← Back to home</a>
    </div>

    <!-- Detail content (hidden until loaded) -->
    <div id="wdContent" style="display:none">
      <div class="wd-breadcrumb" id="wdBreadcrumb"></div>

      <div class="wd-grid">
        <!-- Left: Gallery -->
        <div class="wd-left">
          <div class="wd-gallery" id="wdGallery">
            <img class="wd-main-img" id="wdMainImg" src="" alt="">
            <div class="wd-thumbs" id="wdThumbs"></div>
          </div>
        </div>

        <!-- Right: Info -->
        <div class="wd-info">
          <span class="wd-tag" id="wdCat"></span>
          <h1 class="wd-title" id="wdTitle"></h1>

          <div class="wd-creator" id="wdCreator">
            <div class="wd-creator-avatar" id="wdAvatar"></div>
            <div>
              <div class="wd-creator-name" id="wdCreatorName"></div>
              <div class="wd-creator-role" data-i18n="wd-role">Freelancer</div>
            </div>
          </div>

          <div class="wd-meta" id="wdMeta"></div>
          <div class="wd-tags" id="wdTags"></div>
          <div class="wd-desc" id="wdDesc"></div>

          <div class="wd-cta">
            <button class="btn btn-primary btn-lg" id="wdChatBtn" data-cursor="hover">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
              Chat with creator <span class="btn-arrow">→</span>
            </button>
            <a href="services.html" class="btn btn-ghost" data-cursor="hover">← Browse more services</a>
          </div>

          <!-- Mini chat -->
          <div class="wd-chat" id="wdChat" style="display:none">
            <div class="wd-chat-header" id="wdChatHeader">Chat with creator</div>
            <div class="wd-chat-messages" id="wdChatMessages"></div>
            <div class="wd-chat-input-row" id="wdChatInputRow">
              <input type="text" class="wd-chat-input" id="wdChatInput" placeholder="Type a message..." autocomplete="off">
              <button class="wd-chat-send" id="wdChatSend" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
            <div class="wd-chat-login" id="wdChatLogin" style="display:none">
              <a href="login.html">Log in</a> or <a href="register-client.html">register as client</a> to chat with the creator
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/user-backup.js"></script>
<script src="js/cosmos.js"></script>
<script src="js/nav-dropdown.js"></script>
<script src="js/cursor.js"></script>
<script src="js/user-chip.js"></script>
<script src="js/scroll.js"></script>
<script src="js/work-detail.js"></script>
<script src="js/i18n.js"></script>
<script src="js/radio.js"></script>
</body>
</html>
